<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Produtos</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="fragments/navbar :: navbar"></div>

    <main class="main-content">
        <h1>Lista de Produtos</h1>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Quantidade</th>
                    <th>Valor (R$)</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="produto : ${lista}">
                    <td th:text="${produto.id}"></td>
                    <td th:text="${produto.nome}"></td>
                    <td th:text="${produto.quantidade}"></td>
                    <td th:text="${produto.valor}"></td>
                    <td>
                        <a th:href="@{/produtos/{id}/editar(id=${produto.id})}" class="botao" style="background-color: #f39c12;">Editar</a>
                        <form th:action="@{/produtos/{id}/excluir(id=${produto.id})}" method="post" style="display:inline;">
                            <button type="submit" class="botao" style="background-color: #e74c3c;" onclick="return confirm('Tem certeza que deseja excluir?')">Excluir</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>

    <footer>
        <p>(c) 2025 Meu App</p>
    </footer>
</body>
</html>
